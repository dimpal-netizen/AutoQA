# AutoQA behind nginx.
#
#   sudo cp docker/nginx/autoqa.conf /etc/nginx/sites-available/autoqa
#   sudo ln -s /etc/nginx/sites-available/autoqa /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificates come from certbot — see docs/deployment.md section 4. Run
# certbot *before* reloading with this file in place, or nginx fails to start
# on the missing certificate paths.
#
# Nothing in the compose stack is published to the outside world: the API, the
# web app and the recording screen are all bound to 127.0.0.1. This file is
# what makes any of them reachable, which is also what makes it the only place
# access is controlled.

upstream autoqa_api {
    server 127.0.0.1:29381;
    keepalive 32;
}

upstream autoqa_web {
    server 127.0.0.1:29382;
    keepalive 32;
}

upstream autoqa_record {
    server 127.0.0.1:29383;
}

# Plain HTTP exists only to send people to HTTPS. Certbot's renewal challenge
# is served from here, so it must keep answering on port 80.
server {
    listen 80;
    listen [::]:80;
    server_name autoqa.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name autoqa.example.com;

    ssl_certificate     /etc/letsencrypt/live/autoqa.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autoqa.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Test-case spreadsheets and sample files are uploaded through the API.
    # nginx defaults to 1 MB and rejects anything larger with a 413 that never
    # reaches the application, so the UI reports a failure the API logs know
    # nothing about.
    client_max_body_size 64m;

    access_log /var/log/nginx/autoqa.access.log;
    error_log  /var/log/nginx/autoqa.error.log;

    # -----------------------------------------------------------------------
    # The API
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass http://autoqa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generating a suite calls out to an AI provider, and a report can take
        # a while to assemble. The default 60s cuts those off mid-flight.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Artifacts are streamed from disk by FileResponse — traces run to tens
        # of megabytes. Buffering means nginx writes the whole file to its own
        # temp directory before sending a byte, so a download appears to hang
        # and then arrives all at once.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Probes. Kept separate so uptime monitoring does not depend on the API
    # version prefix.
    location = /health {
        proxy_pass http://autoqa_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # recorder.js, injected into recorded pages and loaded by the web app.
    location /static/ {
        proxy_pass http://autoqa_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------------
    # The recording screen
    #
    # This is a live view of a browser running on the server, and that browser
    # is signed in to whatever the QA engineer signed in to. It has no password
    # of its own — x11vnc runs with -nopw because the only thing that could
    # reach it was this proxy.
    #
    # So the password is here. Create the file first:
    #
    #   sudo apt install apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd-autoqa qa
    #
    # Delete this block entirely if you set AUTOQA_VIRTUAL_DISPLAY=0.
    # -----------------------------------------------------------------------
    location /record/ {
        auth_basic           "AutoQA recording";
        auth_basic_user_file /etc/nginx/.htpasswd-autoqa;

        proxy_pass http://autoqa_record/;

        # noVNC is a WebSocket. Without these three lines it connects, gets a
        # plain HTTP response, and shows a blank grey canvas for ever — with
        # nothing in any log to say why.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A recording session is a person clicking around for as long as they
        # like. Anything short here closes the screen mid-recording.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # -----------------------------------------------------------------------
    # Everything else is the web app
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://autoqa_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }
}
