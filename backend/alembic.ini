[alembic]
script_location = alembic
prepend_sys_path = .

# Migration files get a timestamp prefix so they sort chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# The database URL is NOT set here on purpose — alembic/env.py reads it from
# app.core.config so there is exactly one source of truth (.env).
sqlalchemy.url =

# A ruff post-write hook would auto-format generated migrations, but it shells
# out to ruff.exe, which this machine's Application Control policy blocks —
# that failure would abort `alembic revision` entirely. Format manually instead.
[post_write_hooks]
hooks =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
